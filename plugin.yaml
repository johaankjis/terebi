name: hermes-screen
version: "0.1.0"
description: "Pick what to watch from your own Jellyfin library using real watch history, then play and pause it on your Chromecast with receiver-verified status."
provides_tools:
  - library_status
  - library_pick
  - tv_play
  - tv_pause
  - library_scene_find
  - library_scene_save
  - tv_scene_play
  - tv_game_start
  - tv_youtube_play
  - tv_youtube_pause
  - library_youtube_search
provides_hooks: []
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.0"
license: MIT
tags:
  - tv
  - jellyfin
  - roku
  - chromecast
  - media
config_schema:
  jellyfin_url:
    type: str
    default: ""
    label: "Jellyfin URL"
    description: "Base URL of your Jellyfin server (e.g. http://192.168.1.10:8096)"
  jellyfin_api_key:
    type: secret
    env: JELLYFIN_API_KEY
    label: "Jellyfin API key"
    description: "Jellyfin API key (Dashboard > API Keys)"
  jellyfin_user:
    type: str
    default: ""
    label: "Jellyfin user"
    description: "Jellyfin username or user id (optional)"
  chromecast_host:
    type: str
    default: ""
    label: "Chromecast IP"
    description: "LAN IP address of the Chromecast to play on (connects directly on port 8009; no discovery)"
  cast_media_base_url:
    type: str
    default: ""
    label: "Media URL for the Chromecast"
    description: "http://IP:port where the Chromecast can reach this host's temporary media link (e.g. http://192.168.1.20:8765). No path."
  cast_relay_bind:
    type: str
    default: ""
    label: "Media link listen address"
    description: "Local IP:port the temporary media link listens on while something plays (e.g. 0.0.0.0:8765). Links are random, single-item and expire."

  games_service_url:
    type: str
    default: ""
    label: "Terebi Games service origin"
    description: "Private LAN or HTTPS origin of the standalone rock-paper-scissors service."
  games_api_key:
    type: secret
    env: TEREBI_GAMES_API_KEY
    label: "Terebi Games service key"
    description: "Admin token from the private standalone game configuration. Never share in chat."

  games_receiver_app_id:
    type: str
    default: ""
    label: "Terebi Games Custom Receiver app ID"
    description: "Eight-character Google Cast Developer Console app ID. Register the Chromecast for unpublished testing. Blank keeps manual mirroring."

  youtube_api_key:
    type: secret
    env: YOUTUBE_API_KEY
    label: "YouTube Data API key (optional)"
    description: "Enable title search with YouTube Data API v3. Direct video links need no key."
