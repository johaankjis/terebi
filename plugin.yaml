name: hermes-screen
version: "0.1.0"
description: Hermes runs your home theater: picks from your Jellyfin library and plays on your Roku TV.
provides_tools:
  - library_status
provides_hooks: []
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.0"
license: MIT
tags:
  - tv
  - jellyfin
  - roku
  - media
config_schema:
  jellyfin_url:
    type: str
    default: ""
    label: "Jellyfin URL"
    description: "Base URL of your Jellyfin server (e.g. http://192.168.1.10:8096)"
  jellyfin_api_key:
    type: secret
    env: JELLYFIN_API_KEY
    label: "Jellyfin API key"
    description: "Jellyfin API key (Dashboard > API Keys)"
  jellyfin_user:
    type: str
    default: ""
    label: "Jellyfin user"
    description: "Jellyfin username or user id (optional)"
  roku_ip:
    type: str
    default: ""
    label: "Roku IP"
    description: "Roku IP address (optional; auto-discovered if unset)"
  default_room:
    type: str
    default: "living room"
    label: "Default room"
    description: "Default room name for the Roku"
