name: hermes-screen
version: "0.1.0"
description: "Check your Jellyfin server and pick what to watch from your own library, using real watch history."
provides_tools:
  - library_status
  - library_pick
provides_hooks: []
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.0"
license: MIT
tags:
  - tv
  - jellyfin
  - roku
  - media
config_schema:
  jellyfin_url:
    type: str
    default: ""
    label: "Jellyfin URL"
    description: "Base URL of your Jellyfin server (e.g. http://192.168.1.10:8096)"
  jellyfin_api_key:
    type: secret
    env: JELLYFIN_API_KEY
    label: "Jellyfin API key"
    description: "Jellyfin API key (Dashboard > API Keys)"
  jellyfin_user:
    type: str
    default: ""
    label: "Jellyfin user"
    description: "Jellyfin username or user id (optional)"
