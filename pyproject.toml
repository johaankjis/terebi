[project]
name = "hermes-screen"
version = "0.1.0"
description = "Hermes runs your home theater: picks from your Jellyfin library and plays on your Roku TV."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_screen_plugin", "hermes_screen_plugin.hermes_screen"]
package-dir = {hermes_screen_plugin = ".", "hermes_screen_plugin.hermes_screen" = "hermes_screen"}

[tool.setuptools.package-data]
hermes_screen_plugin = ["plugin.yaml"]
